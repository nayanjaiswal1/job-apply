[importlinter]
root_package = job_agent
include_external_packages = True

[importlinter:contract:agents-use-ports-only]
name = Agents must only import from ports and state, never tools or db direct
type = forbidden
source_modules =
    job_agent.agents
forbidden_modules =
    job_agent.tools
    job_agent.db

[importlinter:contract:state-is-leaf]
name = State module must not import from agents, tools, or db
type = forbidden
source_modules =
    job_agent.state
forbidden_modules =
    job_agent.agents
    job_agent.tools
    job_agent.db

[importlinter:contract:ports-are-interfaces]
name = Ports must not import from tools or db (they are pure protocols)
type = forbidden
source_modules =
    job_agent.ports
forbidden_modules =
    job_agent.tools
    job_agent.db
